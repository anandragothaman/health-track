<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Private family blood pressure and blood glucose tracker" />
    <title>Family Health Track</title>
    <script>
      // Apply saved theme / text size before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ht-theme');
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (localStorage.getItem('ht-text') === 'large') document.documentElement.classList.add('text-large');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
